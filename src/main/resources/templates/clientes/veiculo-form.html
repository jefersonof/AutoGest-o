<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo veículo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><aside class="sidebar"><h4>🚘 AutoGestão Pro</h4><nav><a class="active" href="/clientes">👥 Clientes</a></nav></aside><main class="content"><div class="topbar"><div><h2>Novo veículo</h2><p>Cliente: <strong th:text="${cliente.nome}"></strong></p></div></div><form class="card panel p-4" th:action="@{/clientes/{id}/veiculos(id=${cliente.id})}" th:object="${veiculo}" method="post"><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div><div class="row g-3"><div class="col-md-3"><label>Placa *</label><input class="form-control plate-field" th:field="*{placa}" maxlength="7" required></div><div class="col-md-3"><label>Marca *</label><input class="form-control" th:field="*{marca}" required></div><div class="col-md-4"><label>Modelo</label><input class="form-control" th:field="*{modelo}"></div><div class="col-md-2"><label>Ano</label><input class="form-control" th:field="*{ano}" maxlength="4"></div></div><div class="actions"><a class="btn btn-light" href="/clientes">Cancelar</a><button class="btn btn-primary">Salvar veículo</button></div></form></main></body></html>
