<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Novo veículo | AutoGestão Pro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-area">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <!-- CONTEÚDO -->
        <main class="page-content">

            <div class="content-container">

                <!-- CABEÇALHO -->
                <section class="page-header">

                    <div>

                        <h1>Novo veículo</h1>

                        <div class="breadcrumb-custom">
                            <span>Início</span>
                            <span>›</span>
                            <span>Clientes</span>
                            <span>›</span>
                            <span>Novo veículo</span>
                        </div>

                        <p>
                            Cliente:
                            <strong th:text="${cliente.nome}"></strong>
                        </p>

                    </div>

                </section>


                <!-- FORMULÁRIO -->
                <form
                    class="panel form-panel"
                    th:action="@{/clientes/{id}/veiculos(id=${cliente.id})}"
                    th:object="${veiculo}"
                    method="post">

                    <!-- ERRO -->
                    <div
                        th:if="${erro}"
                        class="alert alert-danger"
                        th:text="${erro}">
                    </div>


                    <!-- DADOS DO VEÍCULO -->
                    <div class="section-title">

                        <span>🚗</span>

                        <h5>Dados do veículo</h5>

                    </div>


                    <div class="form-grid">

                        <div class="field field-3">

                            <label>Placa *</label>

                            <input
                                class="form-control plate-field"
                                th:field="*{placa}"
                                maxlength="7"
                                required>

                        </div>


                        <div class="field field-3">

                            <label>Marca *</label>

                            <input
                                class="form-control"
                                th:field="*{marca}"
                                required>

                        </div>


                        <div class="field field-4">

                            <label>Modelo</label>

                            <input
                                class="form-control"
                                th:field="*{modelo}">

                        </div>


                        <div class="field field-2">

                            <label>Ano</label>

                            <input
                                class="form-control"
                                th:field="*{ano}"
                                maxlength="4">

                        </div>

                    </div>


                    <!-- AÇÕES -->
                    <div class="actions">

                        <a
                            class="btn btn-light"
                            href="/clientes">

                            Cancelar

                        </a>

                        <button
                            class="btn btn-primary"
                            type="submit">

                            💾 Salvar veículo

                        </button>

                    </div>

                </form>

            </div>

        </main>


        <!-- FOOTER -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>

</div>

</body>

</html>
