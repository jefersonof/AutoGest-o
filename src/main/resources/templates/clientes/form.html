<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Novo cliente | AutoGestão Pro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-area">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <!-- CONTEÚDO -->
        <main class="page-content">

            <div class="content-container">

                <!-- CABEÇALHO -->
                <section class="page-header">

                    <div>
                        <h1>Cadastro de Cliente</h1>

                        <div class="breadcrumb-custom">
                            <span>Início</span>
                            <span>›</span>
                            <span>Clientes</span>
                            <span>›</span>
                            <span>Novo Cliente</span>
                        </div>

                        <p>Cadastre o cliente e o primeiro veículo</p>
                    </div>

                </section>


                <!-- FORMULÁRIO -->
                <form
                    class="panel form-panel"
                    th:action="@{/clientes}"
                    th:object="${form}"
                    method="post">

                    <!-- ERROS -->
                    <div
                        th:if="${#fields.hasGlobalErrors()}"
                        class="alert alert-danger"
                        th:each="e : ${#fields.globalErrors()}"
                        th:text="${e}">
                    </div>


                    <!-- DADOS DO CLIENTE -->
                    <div class="section-title">
                        <span>👤</span>
                        <h5>Dados do cliente</h5>
                    </div>

                    <div class="form-grid">

                        <div class="field field-large">
                            <label>Nome *</label>

                            <input
                                class="form-control"
                                th:field="*{nome}"
                                required>
                        </div>

                        <div class="field">
                            <label>CPF / CNPJ</label>

                            <input
                                class="form-control"
                                th:field="*{cpfCnpj}">
                        </div>

                        <div class="field">
                            <label>Telefone *</label>

                            <input
                                class="form-control"
                                th:field="*{telefone}"
                                required>
                        </div>

                        <div class="field field-large">
                            <label>E-mail</label>

                            <input
                                type="email"
                                class="form-control"
                                th:field="*{email}">
                        </div>

                    </div>


                    <hr>


                    <!-- ENDEREÇO -->
                    <div class="section-title">
                        <span>📍</span>
                        <h5>Endereço</h5>
                    </div>

                    <div class="form-grid">

                        <div class="field">
                            <label>CEP</label>

                            <input
                                id="cep"
                                class="form-control"
                                th:field="*{cep}">
                        </div>

                        <div class="field field-large">
                            <label>Rua</label>

                            <input
                                id="rua"
                                class="form-control"
                                th:field="*{rua}">
                        </div>

                        <div class="field">
                            <label>Número</label>

                            <input
                                class="form-control"
                                th:field="*{numero}">
                        </div>

                        <div class="field">
                            <label>Bairro</label>

                            <input
                                id="bairro"
                                class="form-control"
                                th:field="*{bairro}">
                        </div>

                        <div class="field field-large">
                            <label>Cidade</label>

                            <input
                                id="cidade"
                                class="form-control"
                                th:field="*{cidade}">
                        </div>

                        <div class="field">
                            <label>UF</label>

                            <input
                                id="estado"
                                maxlength="2"
                                class="form-control"
                                th:field="*{estado}">
                        </div>

                    </div>


                    <hr>


                    <!-- VEÍCULO -->
                    <div class="section-title">
                        <span>🚗</span>
                        <h5>Primeiro veículo</h5>
                    </div>

                    <div class="form-grid">

                        <div class="field">
                            <label>Placa *</label>

                            <input
                                class="form-control plate-field"
                                th:field="*{placa}"
                                maxlength="7"
                                required>
                        </div>

                        <div class="field">
                            <label>Marca *</label>

                            <input
                                class="form-control"
                                th:field="*{marca}"
                                required>
                        </div>

                        <div class="field field-large">
                            <label>Modelo</label>

                            <input
                                class="form-control"
                                th:field="*{modelo}">
                        </div>

                        <div class="field">
                            <label>Ano</label>

                            <input
                                class="form-control"
                                th:field="*{ano}"
                                maxlength="4">
                        </div>

                    </div>


                    <!-- AÇÕES -->
                    <div class="actions">

                        <a
                            class="btn btn-light"
                            href="/clientes">

                            Cancelar

                        </a>

                        <button
                            class="btn btn-primary"
                            type="submit">

                            💾 Salvar cliente

                        </button>

                    </div>

                </form>

            </div>

        </main>


        <!-- FOOTER -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>

</div>


<script th:src="@{/js/cep.js}"></script>

</body>

</html>
