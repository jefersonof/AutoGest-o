<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo cliente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<aside class="sidebar"><h4>🚘 AutoGestão Pro</h4><nav><a class="active" href="/clientes">👥 Clientes</a></nav></aside><main class="content"><div class="topbar"><div><h2>Cadastro de Cliente</h2><p>Cadastre o cliente e o primeiro veículo</p></div></div>
<form class="card panel p-4" th:action="@{/clientes}" th:object="${form}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div>
<h5>👤 Dados do cliente</h5><div class="row g-3"><div class="col-md-6"><label>Nome *</label><input class="form-control" th:field="*{nome}" required></div><div class="col-md-3"><label>CPF / CNPJ</label><input class="form-control" th:field="*{cpfCnpj}"></div><div class="col-md-3"><label>Telefone *</label><input class="form-control" th:field="*{telefone}" required></div><div class="col-md-6"><label>E-mail</label><input type="email" class="form-control" th:field="*{email}"></div></div><hr>
<h5>📍 Endereço</h5><div class="row g-3"><div class="col-md-2"><label>CEP</label><input id="cep" class="form-control" th:field="*{cep}"></div><div class="col-md-5"><label>Rua</label><input id="rua" class="form-control" th:field="*{rua}"></div><div class="col-md-2"><label>Número</label><input class="form-control" th:field="*{numero}"></div><div class="col-md-3"><label>Bairro</label><input id="bairro" class="form-control" th:field="*{bairro}"></div><div class="col-md-4"><label>Cidade</label><input id="cidade" class="form-control" th:field="*{cidade}"></div><div class="col-md-2"><label>UF</label><input id="estado" maxlength="2" class="form-control" th:field="*{estado}"></div></div><hr>
<h5>🚗 Veículo</h5><div class="row g-3"><div class="col-md-3"><label>Placa *</label><input class="form-control plate-field" th:field="*{placa}" maxlength="7" required></div><div class="col-md-3"><label>Marca *</label><input class="form-control" th:field="*{marca}" required></div><div class="col-md-4"><label>Modelo</label><input class="form-control" th:field="*{modelo}"></div><div class="col-md-2"><label>Ano</label><input class="form-control" th:field="*{ano}" maxlength="4"></div></div>
<div class="actions"><a class="btn btn-light" href="/clientes">Cancelar</a><button class="btn btn-primary">💾 Salvar cliente</button></div></form></main><script th:src="@{/js/cep.js}"></script></body></html>
